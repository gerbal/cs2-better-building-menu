# Builds the mod and runs its tests against mock game assemblies kept in a
# private repository: the game's types and signatures, every method body a
# throw. Setup and upkeep are in docs/ci.md. Copy to .github/workflows/.
name: C#

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  csharp:
    # A pull request from a fork gets no secrets, so it skips this job rather
    # than failing it. Never switch this workflow to pull_request_target.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CS2_GAME_PATH: ${{ github.workspace }}/cs2-refs
      # Tests that call into the game cannot pass against mocks; they run
      # locally against the real install.
      CS2_TEST_FILTER: Requires!=Game
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      # Never upload cs2-refs as an artifact or put it in the Actions cache: on
      # a public repository both can be read by others, the cache by pull
      # requests from forks.
      - name: Check out the mock game assemblies
        uses: actions/checkout@v4
        with:
          repository: gerbal/cs2-game-refs
          ssh-key: ${{ secrets.CS2_REFS_DEPLOY_KEY }}
          path: cs2-refs
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: ./build.sh backend

      - name: Test
        run: ./build.sh test
